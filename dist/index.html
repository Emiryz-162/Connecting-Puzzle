<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Connect Puzzle</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,800&display=swap");

    :root {
      --bg-top: #0f1f3d;
      --bg-bottom: #081226;
      --menu-palette-1: #eb8686;
      --menu-palette-2: #f59f95;
      --menu-palette-3: #f9b7a9;
      --menu-palette-4: #fbcbb7;
      --menu-palette-5: #fde4cb;
      --menu-on-surface: #4a3c31;
      --menu-on-surface-soft: #6b5a4d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at 16% 14%, rgba(88, 190, 255, 0.2), transparent 38%),
        radial-gradient(circle at 86% 78%, rgba(246, 196, 69, 0.12), transparent 40%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #game-root,
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      touch-action: none;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .start-screen-root {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: none;
      overflow: hidden;
      background: linear-gradient(135deg, var(--menu-palette-5) 0%, var(--menu-palette-4) 48%, var(--menu-palette-3) 100%);
      pointer-events: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .start-screen-root::before,
    .start-screen-root::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(120px);
      pointer-events: none;
    }

    .start-screen-root::before {
      width: min(36vw, 420px);
      height: min(36vw, 420px);
      left: -60px;
      top: 68px;
      background: color-mix(in srgb, var(--menu-palette-1) 72%, transparent);
    }

    .start-screen-root::after {
      width: min(42vw, 500px);
      height: min(42vw, 500px);
      right: -80px;
      bottom: -44px;
      background: color-mix(in srgb, var(--menu-palette-2) 78%, transparent);
    }

    .start-screen-content {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-inline: 16px;
      pointer-events: none;
    }

    .menu-title {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.88;
      letter-spacing: -0.035em;
      font-weight: 800;
      font-style: italic;
      color: var(--menu-palette-1);
      text-shadow: 0 5px 14px rgba(116, 64, 64, 0.22);
    }

    .menu-title-accent {
      margin-left: 0.88em;
      color: var(--menu-palette-2);
    }

    .menu-subtitle {
      margin: 22px 0 34px;
      width: min(90vw, 520px);
      line-height: 1.45;
      color: var(--menu-on-surface-soft);
      font-weight: 700;
      pointer-events: none;
    }

    .menu-actions {
      width: min(92vw, 410px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      pointer-events: auto;
    }

    .play-btn,
    .sections-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 22px;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
    }

    .play-btn {
      color: #ffffff;
      background: var(--menu-palette-2);
      box-shadow: 0 8px 0 0 #c57673;
    }

    .sections-btn {
      color: var(--menu-palette-1);
      background: var(--menu-palette-5);
      box-shadow: 0 8px 0 0 #d9c5af;
    }

    .tutorial-menu-btn {
      color: #ffffff;
      background: linear-gradient(145deg, #f3a28f, #e98787);
      box-shadow: 0 8px 0 0 #bd6c67;
    }

    .album-menu-btn {
      color: #ffffff;
      background: linear-gradient(145deg, #efa78a, #d97f74);
      box-shadow: 0 8px 0 0 #b96a60;
    }

    .button-label {
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .play-btn:hover,
    .sections-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .play-btn:active,
    .sections-btn:active {
      transform: translateY(6px);
      box-shadow: none;
    }

    .settings-btn {
      position: fixed;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      color: var(--menu-palette-1);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 16px rgba(127, 77, 77, 0.22);
      cursor: pointer;
      touch-action: manipulation;
      pointer-events: auto;
      transition: transform 140ms ease, filter 140ms ease;
    }

    .settings-btn:hover {
      transform: scale(1.06);
      filter: brightness(1.03);
    }

    .settings-btn:active {
      transform: scale(0.96);
    }

    .now-playing-card {
      position: absolute;
      right: 26px;
      bottom: 36px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 26px rgba(74, 60, 49, 0.2);
      transform: rotate(3deg);
      color: var(--menu-on-surface);
      pointer-events: none;
    }

    .now-playing-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--menu-palette-3);
      color: #ffffff;
    }

    .now-playing-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--menu-palette-1);
    }

    .now-playing-title {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .menu-title-accent {
        margin-left: 0.58em;
      }

      .menu-actions {
        width: min(92vw, 360px);
      }
    }

    .sections-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 18% 10%, rgba(245, 159, 149, 0.18), transparent 42%),
        rgba(72, 46, 40, 0.48);
      backdrop-filter: blur(4px);
      pointer-events: none;
      padding: 14px;
    }

    .sections-overlay.is-open {
      display: flex;
    }

    .sections-panel {
      width: min(540px, calc(100vw - 20px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: linear-gradient(165deg, rgba(253, 228, 203, 0.98), rgba(251, 203, 183, 0.96));
      box-shadow: 0 20px 40px rgba(107, 79, 69, 0.28);
      padding: 16px;
    }

    .album-panel {
      width: min(620px, calc(100vw - 20px));
      overflow: auto;
    }

    .sections-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .sections-title {
      margin: 0;
      font-size: clamp(24px, 4.6vw, 30px);
      line-height: 1;
      letter-spacing: 0.06em;
      font-weight: 800;
      color: var(--menu-palette-1);
    }

    .sections-subtitle {
      margin: 6px 0 0;
      color: var(--menu-on-surface-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .sections-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(235, 134, 134, 0.34);
      background: rgba(255, 255, 255, 0.62);
      color: var(--menu-on-surface-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .sections-close-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.03);
    }

    .sections-close-btn:active {
      transform: scale(0.95);
    }

    .sections-category-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .sections-category-btn {
      border: 1px solid rgba(235, 134, 134, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.54);
      color: var(--menu-on-surface-soft);
      font-weight: 800;
      font-size: 13px;
      padding: 8px 10px;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background-color 120ms ease;
    }

    .sections-category-btn.active {
      background: linear-gradient(140deg, rgba(245, 159, 149, 0.84), rgba(235, 134, 134, 0.92));
      color: #ffffff;
      border-color: rgba(217, 108, 108, 0.72);
    }

    .sections-category-btn:hover {
      transform: translateY(-1px);
    }

    .sections-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .sections-level-btn {
      min-height: 66px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.52);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 6px 14px rgba(107, 79, 69, 0.18);
      color: var(--menu-on-surface);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
      text-align: left;
    }

    .sections-level-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .sections-level-btn:active {
      transform: translateY(1px);
    }

    .sections-level-number {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 800;
    }

    .sections-level-state {
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 700;
      opacity: 0.82;
    }

    .sections-level-btn.done {
      border-color: rgba(235, 134, 134, 0.4);
    }

    .sections-level-btn.current {
      background: linear-gradient(150deg, rgba(245, 159, 149, 0.9), rgba(235, 134, 134, 0.94));
      border-color: rgba(217, 108, 108, 0.74);
      color: #ffffff;
    }

    .sections-level-btn.current .sections-level-state {
      opacity: 0.95;
    }

    .sections-level-btn.locked {
      background: rgba(255, 255, 255, 0.42);
      color: #a59084;
      border-color: rgba(207, 189, 178, 0.62);
      cursor: default;
      box-shadow: none;
    }

    .sections-level-btn.locked:hover,
    .sections-level-btn.locked:active {
      transform: none;
      filter: none;
    }

    .sections-panel[data-theme="foods"] .sections-title {
      color: var(--menu-palette-1);
    }

    .sections-panel[data-theme="foods"] .sections-category-btn.active {
      background: linear-gradient(140deg, rgba(245, 159, 149, 0.84), rgba(235, 134, 134, 0.92));
      border-color: rgba(217, 108, 108, 0.72);
    }

    .sections-panel[data-theme="landmarks"] .sections-title {
      color: #dd7a71;
    }

    .sections-panel[data-theme="landmarks"] .sections-category-btn.active {
      background: linear-gradient(140deg, rgba(244, 169, 133, 0.88), rgba(220, 122, 113, 0.94));
      border-color: rgba(210, 113, 104, 0.74);
    }

    .sections-panel[data-theme="planets"] .sections-title {
      color: #c96868;
    }

    .sections-panel[data-theme="planets"] .sections-category-btn.active {
      background: linear-gradient(140deg, rgba(230, 140, 140, 0.9), rgba(201, 104, 104, 0.94));
      border-color: rgba(190, 95, 95, 0.74);
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .album-empty-state {
      grid-column: 1 / -1;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 1px dashed rgba(235, 134, 134, 0.35);
      color: var(--menu-on-surface-soft);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.5);
    }

    .album-photo-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.48);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 8px 18px rgba(107, 79, 69, 0.18);
      padding: 8px;
    }

    button.album-photo-card {
      width: 100%;
      text-align: inherit;
      color: inherit;
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    .album-photo-card.unlockable {
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .album-photo-card.unlockable:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .album-photo-card.unlockable:active {
      transform: translateY(1px);
    }

    .album-photo-media {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: rgba(243, 207, 184, 0.54);
      border: 1px solid rgba(235, 134, 134, 0.24);
    }

    .album-photo-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      transition: filter 140ms ease, transform 160ms ease;
    }

    .album-photo-caption {
      margin-top: 7px;
      text-align: center;
      color: var(--menu-on-surface-soft);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .album-photo-card.locked .album-photo-image {
      filter: blur(8px) brightness(0.55) saturate(0.38);
      transform: scale(1.24) translateY(-10%);
    }

    .album-photo-card.locked .album-photo-lock-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 22, 29, 0.28);
      color: rgba(255, 255, 255, 0.92);
    }

    .album-photo-card.locked .album-photo-caption {
      color: #a59084;
    }

    .album-viewer-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 22% 16%, rgba(245, 159, 149, 0.12), transparent 48%),
        rgba(23, 16, 19, 0.78);
      backdrop-filter: blur(4px);
      pointer-events: none;
      padding: 12px;
    }

    .album-viewer-overlay.is-open {
      display: flex;
    }

    .album-viewer-dialog {
      width: min(1180px, calc(100vw - 18px));
      max-height: calc(100vh - 24px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: linear-gradient(165deg, rgba(253, 228, 203, 0.98), rgba(251, 203, 183, 0.96));
      box-shadow: 0 20px 44px rgba(20, 13, 16, 0.34);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .album-viewer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .album-viewer-title {
      color: var(--menu-on-surface-soft);
      font-size: clamp(12px, 2.8vw, 14px);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .album-viewer-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(235, 134, 134, 0.34);
      background: rgba(255, 255, 255, 0.66);
      color: var(--menu-on-surface-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .album-viewer-close-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.03);
    }

    .album-viewer-close-btn:active {
      transform: scale(0.95);
    }

    .album-viewer-image-wrap {
      width: 100%;
      height: min(64vh, 560px);
      min-height: min(48vh, 360px);
      max-height: min(64vh, 560px);
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(235, 134, 134, 0.24);
      background: rgba(34, 26, 29, 0.88);
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .album-viewer-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .album-viewer-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .album-viewer-control-btn {
      min-width: 44px;
      min-height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(235, 134, 134, 0.34);
      background: rgba(255, 255, 255, 0.62);
      color: var(--menu-on-surface-soft);
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      padding: 6px 10px;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .album-viewer-control-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .album-viewer-control-btn:active {
      transform: translateY(1px);
    }

    .album-viewer-hint {
      margin-left: 2px;
      color: var(--menu-on-surface-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    @media (max-width: 560px) {
      .album-panel {
        width: min(520px, calc(100vw - 20px));
      }

      .album-viewer-dialog {
        width: min(560px, calc(100vw - 12px));
        max-height: calc(100vh - 16px);
        padding: 9px;
      }

      .album-viewer-image-wrap {
        height: min(46vh, 320px);
        min-height: min(40vh, 260px);
        max-height: min(46vh, 320px);
        aspect-ratio: 16 / 10;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CRh9AXP6.js"></script>
</head>
<body>
  <div id="game-root"></div>
</body>
</html>
